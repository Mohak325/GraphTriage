[PARSER]
    Name        json
    Format      json
    Time_Key    timestamp
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep   On

[PARSER]
    Name        docker_json
    Format      json
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep   On

[PARSER]
    Name        graphtriage_log
    Format      regex
    Regex       ^(?<timestamp>[^ ]+) \[(?<service>[^\]]+)\] \[(?<level>[^\]]+)\] (?<message>.*)$
    Time_Key    timestamp
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z

[PARSER]
    Name        nginx_access
    Format      regex
    Regex       ^(?<remote_addr>[^ ]+) - (?<remote_user>[^ ]+) \[(?<time>[^\]]+)\] "(?<method>[^ ]+) (?<path>[^ ]+) (?<protocol>[^"]+)" (?<status>[^ ]+) (?<body_bytes_sent>[^ ]+) "(?<http_referer>[^"]*)" "(?<http_user_agent>[^"]*)" rt=(?<request_time>[^ ]+)$
    Time_Key    time
    Time_Format %d/%b/%Y:%H:%M:%S %z
