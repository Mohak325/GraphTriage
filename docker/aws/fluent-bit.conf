[SERVICE]
    Flush         1
    Log_Level     info
    Daemon        off
    Parsers_File  fluent-bit-parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

# -------------------------------------------------------------
# INPUT: Microservice Logs from Docker Socket / Forward / Log Directory
# -------------------------------------------------------------
[INPUT]
    Name              tail
    Tag               graphtriage.services.*
    Path              /var/log/graphtriage/*.log
    Parser            json
    DB                /var/log/fluent-bit-services.db
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On
    Refresh_Interval  5

[INPUT]
    Name              forward
    Listen            0.0.0.0
    Port              24224

# -------------------------------------------------------------
# FILTERS: Metadata Enrichment & Anomaly Tagging
# -------------------------------------------------------------
[FILTER]
    Name                record_modifier
    Match               graphtriage.*
    Record environment  production
    Record cluster      graphtriage-prod-useast1
    Record region       us-east-1

[FILTER]
    Name                rewrite_tag
    Match               graphtriage.services.*
    Rule                $log_level ^(ERROR|CRITICAL)$ graphtriage.anomalies.error true
    Emitter_Name        re_emitted

# -------------------------------------------------------------
# OUTPUT 1: Amazon OpenSearch Service (Logs & Traces Index)
# -------------------------------------------------------------
[OUTPUT]
    Name            opensearch
    Match           graphtriage.*
    Host            opensearch
    Port            9200
    Index           graphtriage-logs
    Type            _doc
    Logstash_Format On
    Logstash_Prefix graphtriage-logs
    Logstash_DateFormat %Y.%m.%d
    tls             Off
    Replace_Dots    On
    Retry_Limit     5

# -------------------------------------------------------------
# OUTPUT 2: CloudWatch Logs / Local Dev Stream
# -------------------------------------------------------------
[OUTPUT]
    Name            stdout
    Match           graphtriage.anomalies.*
    Format          json_lines
