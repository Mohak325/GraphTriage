# =============================================
# GRAPHTRIAGE — Production Docker Compose
# =============================================
# Hardened configuration for staging and production deployments.
# Includes Nginx reverse proxy, resource constraints, non-root users,
# health probes, and structured logging.
# =============================================

services:
  # ----- Nginx Reverse Proxy (Edge) -----
  reverse-proxy:
    image: nginx:1.25-alpine
    container_name: graphtriage-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - graphtriage-prod-net
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  # ----- FastAPI Backend Cluster -----
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: graphtriage-backend-prod
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    environment:
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/graphtriage_prod_secret}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://graphtriage.internal}
      - DEBUG=false
      - LOG_LEVEL=WARNING
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - graphtriage-prod-net
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ----- Neo4j Production Enterprise/Community -----
  neo4j:
    image: neo4j:5-community
    container_name: graphtriage-neo4j-prod
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/graphtriage_prod_secret}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=1024m
      - NEO4J_dbms_memory_heap_max__size=2048m
      - NEO4J_dbms_memory_pagecache_size=1024m
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j-prod-data:/data
      - neo4j-prod-logs:/logs
    networks:
      - graphtriage-prod-net
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----- Redis Production Cluster Cache & Broker -----
  redis:
    image: redis:7-alpine
    container_name: graphtriage-redis-prod
    volumes:
      - redis-prod-data:/data
    networks:
      - graphtriage-prod-net
    restart: always
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru --save 60 1000
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1.5G
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ----- Celery Asynchronous Workers -----
  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: graphtriage-celery-prod
    command: ["celery", "-A", "backend.celery_app", "worker", "--loglevel=INFO", "--concurrency=4", "-Q", "rca_tasks"]
    environment:
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/graphtriage_prod_secret}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - graphtriage-prod-net
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

volumes:
  neo4j-prod-data:
  neo4j-prod-logs:
  redis-prod-data:

networks:
  graphtriage-prod-net:
    driver: bridge
