[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telecom-cloud-rca"
version = "0.2.0"
description = "Intelligent Root Cause Analysis (RCA) Framework for Telecom Cloud Services"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Mohak Harsh", email = "mohak@example.com" },
    { name = "Sandarbh Gupta", email = "sandarbhgupta425@gmail.com" }
]
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "statsmodels>=0.14.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "networkx>=3.0",
    "pyyaml>=6.0",
    "structlog>=23.1.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "scikit-learn>=1.2.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
asyncio_mode = "auto"
